[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airi-norvex"
version = "0.2.0"
description = "AIRI chatbot core - HF-only models, Drive only for history/state"
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=0.23",
  "transformers>=4.40",
  "llama-cpp-python>=0.3",
  "Pillow>=10",
  "numpy>=1.26",
  "torch>=2.2",
  "psutil>=5.9",
  "markdown>=3.5",
  "bleach>=6.0",
]

[tool.setuptools]
py-modules = ["airi"]
